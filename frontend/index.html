<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>職涯導航家 — CareerNav</title>
    <style>
        /* ============================================================
           復古視覺樣式：黑底白字、標楷體、雙層像素邊框按鈕
           規格見 docs/IMPLEMENTATION_PLAN_20250731.md Task 7 第四節。
           僅做筆電桌面尺寸（1280px 基準），不寫 mobile media query。
           ============================================================ */
        * { box-sizing: border-box; }

        body {
            background: #000000;
            color: #ffffff;
            font-family: "標楷體", "DFKai-SB", "BiauKai", serif;
            width: 1280px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1 { font-size: 2.2rem; letter-spacing: 0.05em; }

        /* ------------------------------------------------------------
           開場動畫：首頁區塊依序從上到下淡入 + 輕微上移，間隔 0.12 秒。
           .boot-item 預設 opacity:1（立即可見）；只有 #home-screen 帶
           .play-intro 時才從 0 動畫進場——用來實現「僅第一次載入時跑一次，
           重新開始按鈕不重播」（由 JS 的 enterHomeScreen() 判斷 sessionStorage）。
           ------------------------------------------------------------ */
        .boot-item { opacity: 1; }

        #home-screen.play-intro .boot-item {
            opacity: 0;
            animation: bootFadeIn 0.4s ease forwards;
        }
        #home-screen.play-intro .boot-item:nth-child(1) { animation-delay: 0s; }
        #home-screen.play-intro .boot-item:nth-child(2) { animation-delay: 0.12s; }
        #home-screen.play-intro .boot-item:nth-child(3) { animation-delay: 0.24s; }

        @keyframes bootFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ------------------------------------------------------------
           復古像素邊框按鈕：外框 2px 實線 + 內縮 3px 再一層 1px 線。
           按下時整體位移 2px、移除內層框線製造按壓感；hover 時背景反白。
           ------------------------------------------------------------ */
        button {
            position: relative;
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6em 1.4em;
            cursor: pointer;
        }

        button::after {
            content: "";
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        button:hover {
            background: #ffffff;
            color: #000000;
        }
        button:hover::after { border-color: #000000; }

        button:active {
            transform: translate(2px, 2px);
        }
        button:active::after { display: none; }

        /* ------------------------------------------------------------
           對話畫面
           ------------------------------------------------------------ */
        #messages {
            border: 2px solid #ffffff;
            padding: 1rem;
            min-height: 320px;
            margin-bottom: 1rem;
            overflow-y: auto;
        }

        .msg { margin: 0.6rem 0; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg.agent { justify-content: flex-start; }

        /* 用框線粗細/位置區分使用者與 Agent，不用顏色：
           使用者訊息右側粗框在右邊，Agent 訊息左側粗框在左邊。 */
        .msg .bubble {
            display: inline-block;
            max-width: 70%;
            padding: 0.6em 1em;
            border: 1px solid #ffffff;
            white-space: pre-wrap;
        }
        .msg.user .bubble { border-right-width: 4px; }
        .msg.agent .bubble { border-left-width: 4px; }

        /* ------------------------------------------------------------
           等待中跑馬燈：「▪▪▪」三方塊依序亮暗循環
           ------------------------------------------------------------ */
        #waiting-indicator { margin-bottom: 1rem; }
        .marquee-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ffffff;
            margin-right: 6px;
            animation: marqueePulse 1.2s ease-in-out infinite;
        }
        .marquee-dot:nth-child(1) { animation-delay: 0s; }
        .marquee-dot:nth-child(2) { animation-delay: 0.2s; }
        .marquee-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes marqueePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        .waiting-label { margin-left: 0.4em; }

        /* ------------------------------------------------------------
           錯誤畫面
           ------------------------------------------------------------ */
        #error-screen {
            border: 2px solid #ffffff;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        #error-screen::before {
            content: "⚠ ";
        }

        /* ------------------------------------------------------------
           橫式時間軸元件（第六節規格）：
           - 節點橫向排列，節點間用白色橫線串接
           - 決策點項目加粗 + 閃爍框線凸顯
           - related_resource / 課程 有連結時可點擊開新分頁
           - overflow-x: auto 作保險（設計目標 4~5 節點在筆電螢幕內完整顯示）
           ------------------------------------------------------------ */
        .roadmap-container {
            margin-top: 0.6rem;
            max-width: 100%;
        }

        .roadmap-timeline {
            display: flex;
            align-items: flex-start;
            overflow-x: auto;
            padding: 1rem 0.2rem;
            animation: roadmapFadeIn 0.4s ease both;
        }

        @keyframes roadmapFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .roadmap-node {
            flex: 0 0 230px;
            position: relative;
            padding: 0 0.9rem;
        }

        .roadmap-node:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 14px;
            right: -14px;
            width: 28px;
            height: 1px;
            background: #ffffff;
        }

        .roadmap-node-month {
            display: inline-block;
            border: 1px solid #ffffff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 26px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }

        .roadmap-node-label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .roadmap-action {
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 0.4rem;
            padding-left: 0.6rem;
            border-left: 2px solid #ffffff;
        }

        .roadmap-action.decision {
            font-weight: bold;
            animation: decisionBlink 1s step-start infinite;
        }

        @keyframes decisionBlink {
            50% { border-left-color: transparent; }
        }

        .roadmap-action a {
            color: #ffffff;
            text-decoration: underline;
        }

        .roadmap-priority-tag {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 0.3em;
        }

        .roadmap-courses {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .roadmap-courses a {
            color: #ffffff;
        }

        .roadmap-decision-points {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            border-top: 1px dashed #ffffff;
            padding-top: 0.5rem;
        }

        /* ------------------------------------------------------------
           Agent 回覆的 Markdown 排版
           Agent 會用 ## 標題、**粗體**、清單、--- 分隔線，
           這裡壓縮預設邊界，讓對話氣泡不會因為 h2/p/ul 的
           預設 margin 而過度鬆散。
           ------------------------------------------------------------ */
        /* 不設 opacity: 0 當基礎狀態：萬一動畫被停用或未執行（無障礙設定、
           不同瀏覽器、截圖工具），內容仍應可見。淡入只由 keyframes 的
           from 負責，配合 both 讓動畫前後都套用對應狀態。 */
        .md-block {
            animation: mdFadeIn 0.25s ease both;
        }
        @keyframes mdFadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble h2, .bubble h3, .bubble h4, .bubble h5 {
            margin: 0.7em 0 0.35em;
            line-height: 1.35;
        }
        .bubble h2 { font-size: 1.15rem; }
        .bubble h3 { font-size: 1.05rem; }
        .bubble h4, .bubble h5 { font-size: 1rem; }

        .bubble p { margin: 0.35em 0; line-height: 1.6; }
        .bubble ul, .bubble ol { margin: 0.35em 0; padding-left: 1.5em; }
        .bubble li { margin: 0.2em 0; line-height: 1.55; }

        .bubble hr {
            border: none;
            border-top: 1px solid #ffffff;
            opacity: 0.4;
            margin: 0.7em 0;
        }

        .bubble code {
            border: 1px solid #ffffff;
            padding: 0 0.3em;
            font-size: 0.9em;
        }

        .bubble a { color: #ffffff; }

        /* Markdown 渲染後由區塊元素自行處理換行，不需要 pre-wrap */
        .msg.agent .bubble { white-space: normal; }

        /* ------------------------------------------------------------
           規劃圖通知卡（對話串內）＋ 專屬規劃圖畫面
           ------------------------------------------------------------ */
        .roadmap-notice {
            border: 2px solid #ffffff;
            padding: 1rem 1.2rem;
            margin: 0.8rem 0 0.4rem;
            animation: mdFadeIn 0.35s ease both;
        }
        .roadmap-notice-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        .roadmap-notice-meta {
            font-size: 0.85rem;
            opacity: 0.8;
            margin-bottom: 0.8rem;
        }
        /* 用閃爍外框把視線引導到這顆按鈕（demo 時要一眼看到） */
        .roadmap-notice-btn {
            animation: noticeBlink 1.4s step-start infinite;
        }
        @keyframes noticeBlink {
            50% { border-color: rgba(255, 255, 255, 0.35); }
        }

        #roadmap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.6rem;
        }
        #roadmap-heading { font-size: 1.6rem; margin: 0; }

        #roadmap-view {
            border: 2px solid #ffffff;
            padding: 1rem;
            min-height: 340px;
        }

        @media (prefers-reduced-motion: reduce) {
            .md-block, .roadmap-notice { animation: none; opacity: 1; }
            .roadmap-notice-btn { animation: none; }
        }

        /* ------------------------------------------------------------
           快速評估問卷（互動式小視窗）
           以選擇題為主，每題可選「其他」自行輸入。填完後由 JS 組成
           一段完整敘述送給 Agent，避免多輪一問一答才走到試算與時間軸。
           ------------------------------------------------------------ */
        #wizard-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #wizard-overlay.active { display: flex; }

        #wizard-box {
            position: relative;
            width: 620px;
            border: 2px solid #ffffff;
            background: #000000;
            padding: 1.6rem 1.8rem;
        }
        /* 雙層像素邊框，與按鈕風格一致 */
        #wizard-box::after {
            content: "";
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        #wizard-progress {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 0.6rem;
        }

        #wizard-title {
            font-size: 1.3rem;
            margin: 0 0 0.4rem;
        }

        #wizard-hint {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        #wizard-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        /* 選項按鈕：左對齊、滿寬，與復古按鈕同語彙但更輕量 */
        .wizard-option {
            width: 100%;
            text-align: left;
            padding: 0.55em 1em;
            font-size: 0.95rem;
        }

        #wizard-other-row {
            display: none;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        #wizard-other-row.active { display: flex; }

        #wizard-other-input {
            flex: 1;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.55em 1em;
        }
        #wizard-other-input::placeholder { color: #888888; }

        #wizard-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: space-between;
        }
        #wizard-actions button { font-size: 0.9rem; }

        /* ------------------------------------------------------------
           輸入區
           ------------------------------------------------------------ */
        #input-bar { display: flex; gap: 0.6rem; }
        #message-input {
            flex: 1;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6em 1em;
        }
        #message-input::placeholder { color: #888888; }

        /* 鍵盤操作可見焦點（滑鼠點擊不會出現，只在 Tab 聚焦時顯示） */
        button:focus-visible,
        #message-input:focus-visible {
            outline: 2px dashed #ffffff;
            outline-offset: 3px;
        }

        /* ------------------------------------------------------------
           語音輸入：麥克風按鈕 + 聆聽中動畫
           - 圖示用 inline SVG 疊矩形畫成像素風麥克風，fill 用 currentColor，
             所以按鈕 hover 反白時圖示會自動跟著變黑，不需要額外規則。
           - 聆聽中：按鈕反白 + 外圈白光脈衝 + 內框閃爍，另外在輸入列上方
             顯示 5 根跳動的白色長條（波形）與「聆聽中」狀態文字。
           ------------------------------------------------------------ */
        #mic-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6em 0.95em;
        }

        .mic-icon { display: block; }

        #mic-btn.listening {
            background: #ffffff;
            color: #000000;
            animation: micPulse 1.1s ease-out infinite;
        }
        #mic-btn.listening::after {
            border-color: #000000;
            animation: micRingBlink 0.9s step-start infinite;
        }

        @keyframes micPulse {
            from { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.75); }
            to   { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
        }

        @keyframes micRingBlink {
            50% { border-color: transparent; }
        }

        /* 不支援語音辨識時，按鈕降級為「僅示範動畫」，用虛線框暗示 */
        #mic-btn.demo-only { border-style: dashed; }

        #voice-status {
            display: none;
            align-items: flex-end;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            min-height: 24px;
        }
        #voice-status.visible { display: flex; }

        .voice-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 24px;
        }

        .voice-bar {
            width: 6px;
            height: 6px;
            background: #ffffff;
            animation: voiceBar 0.9s ease-in-out infinite;
        }
        .voice-bar:nth-child(1) { animation-delay: 0s; }
        .voice-bar:nth-child(2) { animation-delay: 0.12s; }
        .voice-bar:nth-child(3) { animation-delay: 0.24s; }
        .voice-bar:nth-child(4) { animation-delay: 0.36s; }
        .voice-bar:nth-child(5) { animation-delay: 0.48s; }

        @keyframes voiceBar {
            0%, 100% { height: 6px; }
            50% { height: 24px; }
        }

        /* 停止聆聽後只留文字提示（權限被拒、不支援等），波形隱藏 */
        #voice-status.text-only .voice-bars { display: none; }

        .voice-label {
            font-size: 0.95rem;
            line-height: 24px;
        }

        /* 尊重系統「減少動態效果」設定：關掉所有裝飾性動畫 */
        @media (prefers-reduced-motion: reduce) {
            #mic-btn.listening,
            #mic-btn.listening::after,
            .voice-bar,
            .marquee-dot,
            .roadmap-action.decision {
                animation: none;
            }
            .voice-bar { height: 16px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         狀態機畫面：一次只顯示一個 .screen.active
         home-screen -> chat-screen
         chat-screen 內再由 JS 切換 waiting / error 狀態
         ============================================================ -->

    <div id="home-screen" class="screen">
        <h1 class="boot-item">職涯導航家</h1>
        <p class="boot-item">一站式政府補助 &amp; 轉職行動計畫 AI 顧問</p>
        <div class="boot-item" style="display: flex; gap: 0.8rem; margin-top: 0.4rem;">
            <button id="start-chat-btn" type="button">開始評估</button>
            <button id="demo-preset-btn" type="button">一鍵示範情境</button>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <div id="messages"></div>

        <div id="waiting-indicator" style="display: none;">
            <span class="marquee-dot"></span><span class="marquee-dot"></span><span class="marquee-dot"></span>
            <span class="waiting-label">等待中</span>
        </div>

        <div id="error-screen" style="display: none;">
            <span id="error-message"></span>
            <div style="margin-top: 0.8rem; display: flex; gap: 0.6rem;">
                <button id="retry-btn" type="button">重新發送</button>
                <button id="reset-btn" type="button">重新開始</button>
            </div>
        </div>

        <!-- 語音狀態列：聆聽中的波形動畫 + 狀態文字（aria-live 讓螢幕閱讀器讀出） -->
        <div id="voice-status" role="status" aria-live="polite">
            <span class="voice-bars" aria-hidden="true">
                <span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span><span class="voice-bar"></span>
            </span>
            <span class="voice-label" id="voice-label"></span>
        </div>
        <div id="input-bar">
            <input id="message-input" type="text" placeholder="輸入訊息..." autocomplete="off">
            <button id="mic-btn" type="button" aria-label="語音輸入" aria-pressed="false" title="語音輸入（點一下開始，再點一下結束）">
                <!-- 像素風麥克風：純矩形堆疊，fill=currentColor 以跟隨按鈕文字色，hover 反白時自動變黑 -->
                <svg class="mic-icon" width="14" height="18" viewBox="0 0 14 18" aria-hidden="true" focusable="false">
                    <rect x="5" y="0" width="4" height="9" fill="currentColor" />
                    <rect x="2" y="6" width="2" height="3" fill="currentColor" />
                    <rect x="10" y="6" width="2" height="3" fill="currentColor" />
                    <rect x="2" y="9" width="10" height="2" fill="currentColor" />
                    <rect x="6" y="11" width="2" height="4" fill="currentColor" />
                    <rect x="3" y="15" width="8" height="2" fill="currentColor" />
                </svg>
            </button>
            <button id="send-btn" type="button">送出</button>
            <button id="wizard-open-btn" type="button">快速評估</button>
            <button id="reset-btn-2" type="button">重新開始</button>
        </div>
    </div>

    <!-- ============================================================
         專屬規劃圖畫面：由對話串的「點擊瀏覽規劃圖」進入，
         全寬呈現橫式時間軸，可返回對話繼續詢問。
         ============================================================ -->
    <div id="roadmap-screen" class="screen">
        <div id="roadmap-header">
            <h1 id="roadmap-heading">您的轉職行動計畫</h1>
            <button id="roadmap-back-btn" type="button">返回對話</button>
        </div>
        <div id="roadmap-view"></div>
    </div>

    <!-- ============================================================
         快速評估問卷小視窗：選擇題為主，每題可選「其他」自填。
         填完後由 JS 組成完整敘述，分兩段自動送出（見 runWizardFlow）。
         ============================================================ -->
    <div id="wizard-overlay">
        <div id="wizard-box">
            <div id="wizard-progress"></div>
            <h2 id="wizard-title"></h2>
            <div id="wizard-hint"></div>
            <div id="wizard-options"></div>
            <div id="wizard-other-row">
                <input id="wizard-other-input" type="text" autocomplete="off">
                <button id="wizard-other-confirm" type="button">確定</button>
            </div>
            <div id="wizard-actions">
                <button id="wizard-back" type="button">上一題</button>
                <button id="wizard-cancel" type="button">改用自由對話</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // ============================================================
        // 設定
        // ============================================================
        // 同源相對路徑：前端與 API 都由同一個 CloudFront distribution 提供，
        // /chat 這條 behavior 會被 CloudFront 以 OAC（SigV4）簽名後轉發到
        // Lambda Function URL。因此前端不需要知道 Function URL、不需簽名、
        // 也沒有跨網域 CORS 問題。（本機用 file:// 開啟時此路徑無效，需透過
        // CloudFront 網址存取；見 docs/reports/TASK_7_REPORT.md。）
        const API_ENDPOINT = "/chat";
        const WAIT_TIMEOUT_MS = 60000; // 第五節規格：等待超過 60 秒視為逾時
        const BOOT_FLAG_KEY = "cn_booted"; // sessionStorage：開場動畫只播一次
        // 回覆呈現節奏（取代原本逐字打字機，理由見 revealBlocks 註解）：

        // ============================================================

        // ============================================================
        // 使用者訊息立即顯示；Agent 回覆用逐字打字機效果（第四節規格：
        // 每字 20~30ms，本專案取 TYPE_INTERVAL_MS = 25ms）。
        function appendMessage(role, text) {

            bubble.className = "bubble";

        // ------------------------------------------------------------
        // Markdown 渲染
        // ------------------------------------------------------------
        // Agent 回覆是 Markdown（## 標題、**粗體**、- 清單、--- 分隔線），
        // 直接用 textContent 會把符號原樣印出來。這裡做一個最小可用的
        // 渲染器，只支援 Agent 實際會用到的語法。
        //
        // 安全性：先把 HTML 特殊字元轉義（escapeHtml），之後才套用
        // Markdown 規則，因此即使回覆內容含 HTML 也不會被當成標籤執行。
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function renderInline(text) {
            return text
                // **粗體**
                .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
                // `程式碼`
                .replace(/`([^`]+)`/g, "<code>$1</code>")
                // [文字](網址)：只允許 http/https，避免 javascript: 之類的 scheme
                .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
                    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        }

        // 把 Markdown 切成一個個「區塊元素」，供 revealBlocks 逐塊淡入。
        function markdownToBlocks(text) {
            const lines = escapeHtml(text || "").split("\n");
            const blocks = [];
            let listBuffer = [];
            let listType = null;

            const flushList = () => {
                if (!listBuffer.length) return;
                const tag = listType === "ol" ? "ol" : "ul";
                blocks.push("<" + tag + ">" + listBuffer.join("") + "</" + tag + ">");
                listBuffer = [];
                listType = null;
            };

            for (const raw of lines) {
                const line = raw.trimEnd();

                // 分隔線
                if (/^\s*---+\s*$/.test(line)) {
                    flushList();
                    blocks.push("<hr>");
                    continue;
                }
                // 標題 # ~ ####
                const h = line.match(/^\s*(#{1,4})\s+(.*)$/);
                if (h) {
                    flushList();
                    // Agent 慣用 ## 當主標題，因此 ## → h2（# 也併入 h2），
                    // ### → h3、#### → h4；不產生 h1 以免與頁面標題層級衝突。
                    const level = Math.min(Math.max(h[1].length, 2), 5);
                    blocks.push("<h" + level + ">" + renderInline(h[2]) + "</h" + level + ">");
                    continue;
                }
                // 有序清單 1. 2. 3.
                const ol = line.match(/^\s*\d+\.\s+(.*)$/);
                if (ol) {
                    if (listType && listType !== "ol") flushList();
                    listType = "ol";
                    listBuffer.push("<li>" + renderInline(ol[1]) + "</li>");
                    continue;
                }
                // 無序清單 - 或 *（含縮排的子項，一律拉平為同層，維持版面簡潔）
                const ul = line.match(/^\s*[-*]\s+(.*)$/);
                if (ul) {
                    if (listType && listType !== "ul") flushList();
                    listType = "ul";
                    listBuffer.push("<li>" + renderInline(ul[1]) + "</li>");
                    continue;
                }
                // 空行：結束清單
                if (line.trim() === "") {
                    flushList();
                    continue;
                }
                // 一般段落
                flushList();
                blocks.push("<p>" + renderInline(line) + "</p>");
            }
            flushList();
            return blocks;
        }

        // 逐「區塊」淡入，取代原本的逐字打字機。
        // 為什麼改掉逐字：實測 Agent 回覆常達 1200+ 字，以每字 25ms 計要跑
        // 30 秒以上，live demo 無法等待；且逐字是操作 textContent，無法呈現
        // Markdown 格式。改為逐塊淡入後既保留「內容逐步出現」的節奏感，
        // 總時長又能控制在 REVEAL_TOTAL_MS 以內。
        function revealBlocks(bubble, text) {
            return new Promise((resolve) => {
                const blocks = markdownToBlocks(text);
                if (!blocks.length) {
                    resolve();
                    return;
                }
                const messages = document.getElementById("messages");
                // 總時長固定：區塊多時自動加快，確保 demo 不會等太久
                const step = Math.max(
                    REVEAL_MIN_STEP_MS,
                    Math.min(REVEAL_STEP_MS, REVEAL_TOTAL_MS / blocks.length)
                );
                let i = 0;
                const timer = setInterval(() => {
                    const el = document.createElement("div");
                    el.className = "md-block";
                    el.innerHTML = blocks[i];
                    bubble.appendChild(el);
                    i++;
                    messages.scrollTop = messages.scrollHeight;
                    if (i >= blocks.length) {
                        clearInterval(timer);
                        resolve();
                    }
                }, step);
            });
        }

        // ============================================================
        // 時間軸元件（第六節：橫式時間軸，直接嵌入對話串）
        // ============================================================
        const PRIORITY_LABELS = {
            "必要": "必要",
            "建議": "建議",
            "決策點": "決策點",
            "里程碑": "里程碑",
            "進行中": "進行中",
        };

        function renderActionLine(action) {
            const isDecision = action.priority === "決策點";
            const line = document.createElement("div");
            line.className = "roadmap-action" + (isDecision ? " decision" : "");

            const link = action.related_resource ? RESOURCE_LINKS[action.related_resource] : null;
            if (link) {
                const a = document.createElement("a");
                a.href = link.source_url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = action.action;
                line.appendChild(a);
            } else {
                line.appendChild(document.createTextNode(action.action));
            }

            if (action.priority) {
                const tag = document.createElement("span");
                tag.className = "roadmap-priority-tag";
                tag.textContent = "[" + (PRIORITY_LABELS[action.priority] || action.priority) + "]";
                line.appendChild(tag);
            }
            return line;
        }

        function renderCourseLine(course) {
            const link = COURSE_LINKS[course.id];
            const line = document.createElement("div");
            if (link) {
                const a = document.createElement("a");
                a.href = link.source_url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = "課程：" + (course.name || link.name);
                line.appendChild(a);
            } else {
                line.textContent = "課程：" + (course.name || course.id);
            }
            return line;
        }

        function buildRoadmapElement(roadmap) {
            const container = document.createElement("div");
            container.className = "roadmap-container";

            const track = document.createElement("div");
            track.className = "roadmap-timeline";

            const curatedCourses = (roadmap.courses && roadmap.courses.curated) || [];

            (roadmap.timeline || []).forEach((node) => {
                const nodeEl = document.createElement("div");
                nodeEl.className = "roadmap-node";

                const monthEl = document.createElement("span");
                monthEl.className = "roadmap-node-month";
                monthEl.textContent = node.month;
                nodeEl.appendChild(monthEl);

                const labelEl = document.createElement("div");
                labelEl.className = "roadmap-node-label";
                labelEl.textContent = node.label || ("第 " + node.month + " 月");
                nodeEl.appendChild(labelEl);

                (node.actions || []).forEach((action) => {
                    nodeEl.appendChild(renderActionLine(action));
                });

                // 課程建議附在對應月份節點下方（依 linked_resource_id 或本節點
                // 有課程相關 action 時顯示；簡化規則：只掛在第一個節點避免重複，
                // 若無 action 對應課程則不特別歸類，一律附掛在含 training 相關
                // action 的節點）。
                const hasTrainingAction = (node.actions || []).some(
                    (a) => a.related_resource === "training_living_allowance"
                );
                if (hasTrainingAction && curatedCourses.length) {
                    const coursesEl = document.createElement("div");
                    coursesEl.className = "roadmap-courses";
                    curatedCourses.forEach((c) => {
                        coursesEl.appendChild(renderCourseLine(c));
                    });
                    nodeEl.appendChild(coursesEl);
                }

                track.appendChild(nodeEl);
            });

            container.appendChild(track);

            if (roadmap.decision_points && roadmap.decision_points.length) {
                const dp = document.createElement("div");
                dp.className = "roadmap-decision-points";
                roadmap.decision_points.forEach((text) => {
                    const p = document.createElement("div");
                    p.textContent = "◆ " + text;
                    dp.appendChild(p);
                });
                container.appendChild(dp);
            }

            return container;
        }

        // demo 用示範情境（情境 A：58 歲工廠作業員因自動化被資遣）

        let wizardIndex = 0;
        let wizardAnswers = {};

        function submitWizardOther() {

        function answerWizard(id, value) {
            wizardAnswers[id] = value;
            if (wizardIndex < WIZARD_QUESTIONS.length - 1) {

        // 把問卷答案組成一段自然語言敘述，交給 Agent 的 analyze_profile 解析。
        function composeProfileText(answers) {
            return WIZARD_QUESTIONS
                .filter((q) => q.id in answers)
                .map((q) => q.toText(answers[q.id]))
                .join("；") + "。";
        }

        // 兩段式流程：先資格與試算，再時間軸與文件清單。
        async function runWizardFlow(answers) {
            const profileText = composeProfileText(answers);

            const phase1 =
                profileText +
                "\n\n請依序執行 analyze_profile、match_resources、calculate_benefit。" +
                "回覆請控制在 350 字以內：只列出我可以領的方案名稱、每月金額、" +
                "可領期間與總額，各方案一行，並附法規條號。" +
                "不要重複我已提供的資訊，不要列出發給雇主的獎助。";

            // 第 2 段刻意寫得很強硬：實測模型會「聲稱已經執行過」卻沒有真的
            // 呼叫工具，導致前端拿不到 roadmap 資料而畫不出時間軸。因此明確
            // 要求「實際呼叫工具」並說明這是系統繪圖所需。
            const phase2 =
                "現在請務必實際呼叫 generate_roadmap 工具與 get_checklist 工具" +
                "（系統需要工具回傳的結構化資料才能繪製時間軸圖，只用文字描述無法繪圖）。" +
                "呼叫完成後，回覆請控制在 150 字以內：只用兩三句話說明計畫重點與" +
                "最關鍵的決策點，並提醒我點擊下方按鈕瀏覽規劃圖。" +
                "不要在文字中重複列出整份時間軸與文件清單。";

            // 若第 2 段仍沒拿到 roadmap，再補一次更直接的指令（最多一次）。
            const phase2Retry =
                "系統仍未收到時間軸資料。請直接呼叫 generate_roadmap 工具一次，不要只用文字回覆。";

            const r1 = await sendMessage(phase1);
            if (!r1) return;

            const r2 = await sendMessage(phase2);
            if (r2 && !r2.roadmap) {
                await sendMessage(phase2Retry);
            }
        }

        // ============================================================
        // API 呼叫
        // ============================================================
        // 用 GET + query string 呼叫，不用 POST。
        // 原因：公開入口是 CloudFront + Origin Access Control（OAC）簽名
        // 呼叫 Lambda Function URL（AuthType=AWS_IAM），因為比賽沙盒帳號的
        // guardrail 封鎖匿名 Function URL。OAC 對 POST 需要呼叫端自行計算
        // body 的 SHA256 並帶 x-amz-content-sha256 header；改用 GET 就沒有
        // body，CloudFront 能自行完成整個簽名，瀏覽器端零簽名邏輯。
        // 成功時回傳後端 data 物件（含 reply / roadmap），失敗回傳 null。
        // runWizardFlow 依此判斷是否續送下一段、以及是否需要補要 roadmap。
        // requestInFlight 是併發鎖：同一個 session_id 若同時有兩個請求打進
        // AgentCore，會共用同一個 Agent 實例與對話歷史而導致回應為空
        // （已實測）。因此任一請求進行中就拒絕新的送出。
        let requestInFlight = false;

        async function sendMessage(text) {
            if (requestInFlight) return null;
            requestInFlight = true;
            // 送出前一定關掉麥克風：避免等待回覆時還在錄音、聆聽動畫還在跑
            stopListening();
            setVoiceStatus("");
            lastUserMessage = text;
            appendMessage("user", text);
            setState("waiting");

            waitTimeoutHandle = setTimeout(() => {
                showError("等待超過 60 秒，請重新發送");
            }, WAIT_TIMEOUT_MS);

            try {
                const query = new URLSearchParams({
                    q: text,
                    session_id: getOrCreateSessionId(),
                });
                const resp = await fetch(API_ENDPOINT + "?" + query.toString(), {
                    method: "GET",
                });

                clearTimeout(waitTimeoutHandle);

                if (!resp.ok) {
                    let detail = "";
                    try {
                        const errBody = await resp.json();
                        detail = errBody.error || "";
                    } catch (e) {
                        // 回應不是 JSON，忽略細節，仍以 HTTP 狀態碼提示錯誤
                    }
                    showError("發生錯誤（" + resp.status + "）" + (detail ? "：" + detail : ""));
                    return null;
                }

                const data = await resp.json();
                if (data.session_id) sessionId = data.session_id;

                setState("chat");
                const bubble = appendMessage("agent", "");
                await revealBlocks(bubble, data.reply || "（沒有收到回覆內容）");
                // 規格：若這輪有 roadmap 資料，文字顯示完後才淡入時間軸卡片。
                if (data.roadmap) {
                    appendRoadmapNotice(data.roadmap);
                }
                return data;
            } catch (err) {
                clearTimeout(waitTimeoutHandle);
                showError("無法連上伺服器，請檢查網路連線後重新發送");
                return null;
            } finally {
                requestInFlight = false;
            }
        }

        function showError(message) {
            document.getElementById("error-message").textContent = message;
            setState("error");
        }

        function retrySend() {
            if (!lastUserMessage) {
                setState("chat");
                return;
            }
            sendMessage(lastUserMessage);
        }

        // ============================================================
        // 語音輸入（Amazon Transcribe Streaming）
        // ============================================================
        // 用 Amazon Transcribe Streaming 做即時中文（zh-TW）語音辨識：
        //   1. 前端向 /chat?action=voice_url 要一條 presigned WebSocket URL
        //      （由 Lambda 用執行角色代簽，瀏覽器不持有任何 AWS 憑證）
        //   2. getUserMedia 取麥克風 → AudioContext 轉 16kHz 單聲道 PCM
        //   3. 以 AWS event stream 格式把音訊送進 WebSocket
        //   4. 收回 partial / final 逐字稿，即時回填輸入框
        //
        // 不用瀏覽器內建的 Web Speech API，原因：那是把音訊送到 Google 的
        // 服務，非 Google Chrome 的 Chromium / Brave / Electron 會直接回
        // network 錯誤，且不在我們的 AWS 架構內。
        //
        // 任何一步失敗（不支援、拒絕權限、非 HTTPS、簽章過期、連線失敗）
        // 都會退回「示範模式」：聆聽動畫照播完，再顯示原因並請使用者改用
        // 文字輸入。動畫是保底的 demo 價值，不會被錯誤訊息瞬間打斷。
        const VOICE_SAMPLE_RATE = 16000;   // Transcribe 要求與 URL 參數一致
        const VOICE_CHUNK_SAMPLES = 4096;  // 約 256ms/包
        // 聆聽動畫保底時長：引擎再快失敗，動畫也會播完這段時間才收。
        const VOICE_MIN_LISTEN_MS = 2600;
        // 保險：最長連續聆聽時間，避免忘記關麥克風一直錄
        const VOICE_MAX_LISTEN_MS = 30000;
        // 設為 true 可在辨識結束後自動送出（真正免手打的 demo）；
        // 預設 false，讓使用者先確認辨識文字再按送出，避免誤送。
        const VOICE_AUTO_SEND = false;

        let isListening = false;        // 聆聽中（含動畫保底時間，不代表引擎還在跑）
        let listenStartedAt = 0;        // 本次聆聽起始時間，用來算保底剩餘時間
        let voiceHoldHandle = null;     // 保底時間的收尾 timer
        let maxListenHandle = null;     // 最長聆聽時間的 timer
        let pendingVoiceMessage = null; // 等動畫播完才顯示的訊息
        let voiceServiceBroken = false; // 語音服務確認不可用 → 之後直接走示範模式
        let voiceBaseText = "";         // 開始聆聽前輸入框已有的文字，辨識結果接在後面
        let voiceFinalText = "";        // 本次已定稿（IsPartial=false）的逐字稿
        let voiceSocket = null;
        let voiceStream = null;         // MediaStream，結束時要逐一 stop track
        let voiceAudioCtx = null;
        let voiceNodes = null;          // { source, processor, mute }

        function setVoiceStatus(text, opts) {
            const showBars = !!(opts && opts.bars);
            const statusEl = document.getElementById("voice-status");
            document.getElementById("voice-label").textContent = text || "";
            statusEl.classList.toggle("visible", !!text);
            statusEl.classList.toggle("text-only", !!text && !showBars);
        }

        // 聆聽中的視覺狀態：麥克風按鈕反白脈衝 + 波形 + placeholder 提示
        function setListeningUI(on, label) {
            const micBtn = document.getElementById("mic-btn");
            const input = document.getElementById("message-input");
            micBtn.classList.toggle("listening", on);
            micBtn.setAttribute("aria-pressed", on ? "true" : "false");
            if (on) {
                setVoiceStatus(label || "聆聽中…（再點一次麥克風結束）", { bars: true });
                input.placeholder = "聆聽中…";
            } else {
                input.placeholder = "輸入訊息...";
            }
        }

        // 把麥克風按鈕標成示範模式（虛線框 + 提示文字）
        function markMicDemoOnly() {
            const micBtn = document.getElementById("mic-btn");
            micBtn.classList.add("demo-only");
            micBtn.title = "語音輸入（此環境僅示範動畫，請改用文字輸入）";
            micBtn.setAttribute("aria-label", "語音輸入（此環境僅示範動畫）");
        }

        // 開始聆聽：不論走真實辨識或示範模式，動畫都由這裡起算。
        function beginListening(label) {
            isListening = true;
            listenStartedAt = Date.now();
            pendingVoiceMessage = null;
            if (voiceHoldHandle) {
                clearTimeout(voiceHoldHandle);
                voiceHoldHandle = null;
            }
            setListeningUI(true, label);
        }

        // 預約收尾：等動畫保底時間到才收動畫並顯示訊息。
        // 引擎在保底時間內就結束（成功或失敗）時，動畫會繼續播到時間到，
        // 使用者看到的是一段完整的「聆聽中」動畫，而不是閃一下就跳錯誤。
        function scheduleListeningFinish(message) {
            if (!isListening) {
                if (message) setVoiceStatus(message, { bars: false });
                return;
            }
            // 已排定收尾時只更新訊息，不重設倒數（避免動畫被無限延長）
            pendingVoiceMessage = message || pendingVoiceMessage || "";
            if (voiceHoldHandle) return;

            const remain = Math.max(0, VOICE_MIN_LISTEN_MS - (Date.now() - listenStartedAt));
            voiceHoldHandle = setTimeout(() => {
                voiceHoldHandle = null;
                isListening = false;
                setListeningUI(false);
                setVoiceStatus(pendingVoiceMessage || "", { bars: false });
                pendingVoiceMessage = null;

                const input = document.getElementById("message-input");
                const text = input.value.trim();
                if (VOICE_AUTO_SEND && text) {
                    input.value = "";
                    setVoiceStatus("");
                    sendMessage(text);
                }
            }, remain);
        }

        // 純示範模式：只播動畫、不做辨識。
        function startVoiceDemo(reason) {
            if (isListening) return;
            beginListening("聆聽中…（示範模式）");
            scheduleListeningFinish(reason);
        }

        // ---------- AWS event stream 編解碼 ----------
        // Transcribe streaming 的 WebSocket 走 AWS event stream 二進位格式：
        //   [總長度 4B][headers 長度 4B][prelude CRC32 4B][headers][payload][訊息 CRC32 4B]
        // header 格式：[名稱長度 1B][名稱][型別 1B(7=字串)][值長度 2B][值]
        const CRC32_TABLE = (() => {
            const table = new Uint32Array(256);
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let k = 0; k < 8; k++) {
                    c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
                }
                table[i] = c >>> 0;
            }
            return table;
        })();

        function crc32(bytes) {
            let crc = 0xffffffff;
            for (let i = 0; i < bytes.length; i++) {
                crc = CRC32_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
            }
            return (crc ^ 0xffffffff) >>> 0;
        }

        function encodeAudioEvent(pcmBytes) {
            const headers = [
                [":message-type", "event"],
                [":event-type", "AudioEvent"],
                [":content-type", "application/octet-stream"],
            ];
            const encoder = new TextEncoder();

            let headersLength = 0;
            const encodedHeaders = headers.map(([name, value]) => {
                const n = encoder.encode(name);
                const v = encoder.encode(value);
                headersLength += 1 + n.length + 1 + 2 + v.length;
                return [n, v];
            });

            const totalLength = 16 + headersLength + pcmBytes.length;
            const buffer = new Uint8Array(totalLength);
            const view = new DataView(buffer.buffer);

            view.setUint32(0, totalLength);
            view.setUint32(4, headersLength);
            view.setUint32(8, crc32(buffer.subarray(0, 8)));

            let pos = 12;
            encodedHeaders.forEach(([n, v]) => {
                buffer[pos++] = n.length;
                buffer.set(n, pos);
                pos += n.length;
                buffer[pos++] = 7; // 7 = 字串型別
                view.setUint16(pos, v.length);
                pos += 2;
                buffer.set(v, pos);
                pos += v.length;
            });

            buffer.set(pcmBytes, pos);
            view.setUint32(totalLength - 4, crc32(buffer.subarray(0, totalLength - 4)));
            return buffer;
        }

        function decodeEventStreamMessage(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            const view = new DataView(arrayBuffer);
            const totalLength = view.getUint32(0);
            const headersLength = view.getUint32(4);

            const headers = {};
            const decoder = new TextDecoder("utf-8");
            let pos = 12;
            const headersEnd = 12 + headersLength;
            while (pos < headersEnd) {
                const nameLength = bytes[pos++];
                const name = decoder.decode(bytes.subarray(pos, pos + nameLength));
                pos += nameLength;
                const valueType = bytes[pos++];
                if (valueType !== 7) break; // 這裡只會收到字串型別 header
                const valueLength = view.getUint16(pos);
                pos += 2;
                headers[name] = decoder.decode(bytes.subarray(pos, pos + valueLength));
                pos += valueLength;
            }

            const payload = decoder.decode(bytes.subarray(headersEnd, totalLength - 4));
            return { headers, payload };
        }

        // Float32（-1~1）轉 16-bit 小端 PCM
        function floatToPcm16(input) {
            const out = new Uint8Array(input.length * 2);
            const view = new DataView(out.buffer);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
            }
            return out;
        }

        // ---------- 麥克風 → WebSocket 音訊管線 ----------
        function startAudioPipeline() {
            // 指定 sampleRate 讓瀏覽器直接幫我們重取樣到 16kHz，
            // 省掉自己寫 resampler。
            voiceAudioCtx = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: VOICE_SAMPLE_RATE,
            });
            const source = voiceAudioCtx.createMediaStreamSource(voiceStream);
            const processor = voiceAudioCtx.createScriptProcessor(VOICE_CHUNK_SAMPLES, 1, 1);
            // ScriptProcessor 必須連到 destination 才會被驅動，
            // 但中間插一個 gain=0 的節點，避免麥克風聲音回放造成回音。
            const mute = voiceAudioCtx.createGain();
            mute.gain.value = 0;

            processor.onaudioprocess = (e) => {
                if (!voiceSocket || voiceSocket.readyState !== WebSocket.OPEN) return;
                const pcm = floatToPcm16(e.inputBuffer.getChannelData(0));
                try {
                    voiceSocket.send(encodeAudioEvent(pcm));
                } catch (err) {
                    // 連線已關閉，忽略這包
                }
            };

            source.connect(processor);
            processor.connect(mute);
            mute.connect(voiceAudioCtx.destination);
            voiceNodes = { source, processor, mute };
        }

        function teardownAudioPipeline() {
            if (voiceNodes) {
                try {
                    voiceNodes.processor.onaudioprocess = null;
                    voiceNodes.source.disconnect();
                    voiceNodes.processor.disconnect();
                    voiceNodes.mute.disconnect();
                } catch (err) {
                    // 已斷開就忽略
                }
                voiceNodes = null;
            }
            if (voiceAudioCtx) {
                try {
                    voiceAudioCtx.close();
                } catch (err) {
                    // 已關閉就忽略
                }
                voiceAudioCtx = null;
            }
            if (voiceStream) {
                voiceStream.getTracks().forEach((track) => track.stop());
                voiceStream = null;
            }
        }

        // 送一個空的 AudioEvent 告訴 Transcribe「音訊結束」，
        // 它會回最後一段 final 結果後關閉連線。
        function closeVoiceSocket(graceful) {
            if (!voiceSocket) return;
            const socket = voiceSocket;
            voiceSocket = null;
            try {
                if (graceful && socket.readyState === WebSocket.OPEN) {
                    socket.send(encodeAudioEvent(new Uint8Array(0)));
                    setTimeout(() => {
                        try { socket.close(); } catch (err) { /* 已關閉 */ }
                    }, 800);
                } else {
                    socket.onmessage = null;
                    socket.close();
                }
            } catch (err) {
                // 關閉失敗不影響流程
            }
        }

        function handleTranscriptMessage(event) {
            let decoded;
            try {
                decoded = decodeEventStreamMessage(event.data);
            } catch (err) {
                return;
            }

            // 伺服器端例外（簽章過期、參數錯誤等）
            if (decoded.headers[":message-type"] === "exception") {
                voiceServiceBroken = true;
                markMicDemoOnly();
                scheduleListeningFinish("語音服務回報錯誤，已切換示範模式，請改用文字輸入");
                teardownAudioPipeline();
                closeVoiceSocket(false);
                return;
            }

            let body;
            try {
                body = JSON.parse(decoded.payload);
            } catch (err) {
                return;
            }

            const results = (body.Transcript && body.Transcript.Results) || [];
            let partial = "";
            results.forEach((result) => {
                const alt = (result.Alternatives || [])[0];
                if (!alt) return;
                if (result.IsPartial) {
                    partial += alt.Transcript || "";
                } else {
                    voiceFinalText += alt.Transcript || "";
                }
            });

            const input = document.getElementById("message-input");
            input.value = (voiceBaseText + voiceFinalText + partial).trim();
        }

        async function startListening() {
            if (isListening) return;

            const canCapture = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
                && window.isSecureContext && typeof WebSocket !== "undefined";
            if (!canCapture) {
                startVoiceDemo("此環境無法取用麥克風（需 HTTPS 網址與較新的瀏覽器），請改用文字輸入");
                return;
            }
            if (voiceServiceBroken) {
                startVoiceDemo("此環境的語音服務連不上，僅示範動畫，請改用文字輸入");
                return;
            }

            // 先起動畫：後面要取麥克風權限、要拿簽章 URL，都有延遲，
            // 動畫先跑使用者才知道系統有反應。
            voiceFinalText = "";
            voiceBaseText = document.getElementById("message-input").value.trim();
            if (voiceBaseText) voiceBaseText += " ";
            beginListening("啟動語音辨識…");

            try {
                voiceStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,
                    },
                });
            } catch (err) {
                const denied = err && (err.name === "NotAllowedError" || err.name === "SecurityError");
                scheduleListeningFinish(denied
                    ? "麥克風權限被拒，請在瀏覽器網址列允許麥克風，或改用文字輸入"
                    : "找不到可用的麥克風，請改用文字輸入");
                return;
            }

            let voiceUrl;
            try {
                const resp = await fetch(API_ENDPOINT + "?action=voice_url", { method: "GET" });
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                const data = await resp.json();
                if (!data.url) throw new Error("no url in response");
                voiceUrl = data.url;
            } catch (err) {
                teardownAudioPipeline();
                voiceServiceBroken = true;
                markMicDemoOnly();
                scheduleListeningFinish("無法取得語音服務授權，已切換示範模式，請改用文字輸入");
                return;
            }

            // 使用者可能在等待期間又點了一次麥克風取消
            if (!isListening) {
                teardownAudioPipeline();
                return;
            }

            try {
                voiceSocket = new WebSocket(voiceUrl);
                voiceSocket.binaryType = "arraybuffer";
            } catch (err) {
                teardownAudioPipeline();
                scheduleListeningFinish("語音連線建立失敗，請改用文字輸入");
                return;
            }

            voiceSocket.addEventListener("open", () => {
                setVoiceStatus("聆聽中…（再點一次麥克風結束）", { bars: true });
                startAudioPipeline();
                // 保險：最長錄 VOICE_MAX_LISTEN_MS，避免一直開著
                maxListenHandle = setTimeout(() => {
                    maxListenHandle = null;
                    finishVoiceCapture();
                }, VOICE_MAX_LISTEN_MS);
            });

            voiceSocket.addEventListener("message", handleTranscriptMessage);

            voiceSocket.addEventListener("error", () => {
                teardownAudioPipeline();
                voiceServiceBroken = true;
                markMicDemoOnly();
                scheduleListeningFinish("語音服務連線失敗，已切換示範模式，請改用文字輸入");
            });

            voiceSocket.addEventListener("close", () => {
                teardownAudioPipeline();
                if (maxListenHandle) {
                    clearTimeout(maxListenHandle);
                    maxListenHandle = null;
                }
                const text = document.getElementById("message-input").value.trim();
                const msg = pendingVoiceMessage
                    ? pendingVoiceMessage
                    : (text ? "已完成辨識，可修改後送出" : "沒有聽到語音，請再試一次");
                scheduleListeningFinish(msg);
            });
        }

        // 收音結束（使用者再點一次麥克風、或到最長時間）：
        // 音訊管線先停，WebSocket 用 graceful 方式關以取回最後一段 final。
        function finishVoiceCapture() {
            teardownAudioPipeline();
            closeVoiceSocket(true);
            const text = document.getElementById("message-input").value.trim();
            scheduleListeningFinish(text ? "已完成辨識，可修改後送出" : "");
        }

        // 使用者主動結束（送出訊息、重新開始、離開對話畫面）：
        // 立即收動畫，不套用保底時長。
        function stopListening() {
            if (voiceHoldHandle) {
                clearTimeout(voiceHoldHandle);
                voiceHoldHandle = null;
            }
            if (maxListenHandle) {
                clearTimeout(maxListenHandle);
                maxListenHandle = null;
            }
            pendingVoiceMessage = null;
            teardownAudioPipeline();
            closeVoiceSocket(false);
            isListening = false;
            setListeningUI(false);
        }

        function toggleListening() {
            if (isListening) {
                // 有連線時走 graceful 收尾（還能拿到最後一段辨識結果），
                // 沒連線（示範模式或還在啟動中）就直接停。
                if (voiceSocket) {
                    finishVoiceCapture();
                } else {
                    stopListening();
                    setVoiceStatus("");
                }
            } else {
                startListening();
            }
        }

        // ============================================================
        // 事件綁定
        // ============================================================
        // 「開始對話」直接帶出快速評估問卷：live demo 要能少打字、快觸發。
        document.getElementById("start-chat-btn").addEventListener("click", () => {
            setState("chat");
            openWizard();
        });

        // 一鍵示範情境：台上最快路徑，跳過逐題點選直接跑兩段式流程。
        document.getElementById("demo-preset-btn").addEventListener("click", () => {
            setState("chat");
            closeWizard();
            runWizardFlow(DEMO_PRESET);
        });

        document.getElementById("roadmap-back-btn").addEventListener("click", () => setState("chat"));
        document.getElementById("wizard-open-btn").addEventListener("click", openWizard);
        document.getElementById("wizard-cancel").addEventListener("click", closeWizard);
        document.getElementById("wizard-other-confirm").addEventListener("click", submitWizardOther);
        document.getElementById("wizard-other-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitWizardOther();
        });
        document.getElementById("wizard-back").addEventListener("click", () => {
            if (wizardIndex > 0) {
                wizardIndex--;
                renderWizardQuestion();
            }
        });

        document.getElementById("send-btn").addEventListener("click", () => {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            sendMessage(text);
        });

        // 麥克風：點一下開始聆聽，再點一下結束（鍵盤 Enter/Space 亦可，因為是 button）
        document.getElementById("mic-btn").addEventListener("click", toggleListening);

        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                document.getElementById("send-btn").click();
            }
        });

        document.getElementById("retry-btn").addEventListener("click", retrySend);
        document.getElementById("reset-btn").addEventListener("click", resetConversation);
        document.getElementById("reset-btn-2").addEventListener("click", resetConversation);

        // ============================================================
        // 開場
        // ============================================================
        // 語音能力偵測：不支援 / 非安全來源時把麥克風按鈕標成虛線框（示範模式），
        // 點下去仍會播聆聽動畫，只是不做真實辨識。
        (function initVoiceCapability() {
            const canCapture = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
                && window.isSecureContext && typeof WebSocket !== "undefined";
            if (!canCapture) markMicDemoOnly();
        })();

        enterHomeScreen();
    </script>
</body>
</html>
