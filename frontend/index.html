<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280">
    <title>職涯導航家 — CareerNav</title>
    <style>
        /* ============================================================
           復古視覺樣式：黑底白字、標楷體、雙層像素邊框按鈕
           規格見 docs/IMPLEMENTATION_PLAN_20250731.md Task 7 第四節。
           僅做筆電桌面尺寸（1280px 基準），不寫 mobile media query。
           ============================================================ */
        * { box-sizing: border-box; }

        body {
            background: #000000;
            color: #ffffff;
            font-family: "標楷體", "DFKai-SB", "BiauKai", serif;
            width: 1280px;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        h1 { font-size: 2.2rem; letter-spacing: 0.05em; }

        /* ------------------------------------------------------------
           開場動畫：首頁區塊依序從上到下淡入 + 輕微上移，間隔 0.12 秒。
           .boot-item 預設 opacity:1（立即可見）；只有 #home-screen 帶
           .play-intro 時才從 0 動畫進場——用來實現「僅第一次載入時跑一次，
           重新開始按鈕不重播」（由 JS 的 enterHomeScreen() 判斷 sessionStorage）。
           ------------------------------------------------------------ */
        .boot-item { opacity: 1; }

        #home-screen.play-intro .boot-item {
            opacity: 0;
            animation: bootFadeIn 0.4s ease forwards;
        }
        #home-screen.play-intro .boot-item:nth-child(1) { animation-delay: 0s; }
        #home-screen.play-intro .boot-item:nth-child(2) { animation-delay: 0.12s; }
        #home-screen.play-intro .boot-item:nth-child(3) { animation-delay: 0.24s; }

        @keyframes bootFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ------------------------------------------------------------
           復古像素邊框按鈕：外框 2px 實線 + 內縮 3px 再一層 1px 線。
           按下時整體位移 2px、移除內層框線製造按壓感；hover 時背景反白。
           ------------------------------------------------------------ */
        button {
            position: relative;
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6em 1.4em;
            cursor: pointer;
        }

        button::after {
            content: "";
            position: absolute;
            top: 3px; left: 3px; right: 3px; bottom: 3px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        button:hover {
            background: #ffffff;
            color: #000000;
        }
        button:hover::after { border-color: #000000; }

        button:active {
            transform: translate(2px, 2px);
        }
        button:active::after { display: none; }

        /* ------------------------------------------------------------
           對話畫面
           ------------------------------------------------------------ */
        #messages {
            border: 2px solid #ffffff;
            padding: 1rem;
            min-height: 320px;
            margin-bottom: 1rem;
            overflow-y: auto;
        }

        .msg { margin: 0.6rem 0; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg.agent { justify-content: flex-start; }

        /* 用框線粗細/位置區分使用者與 Agent，不用顏色：
           使用者訊息右側粗框在右邊，Agent 訊息左側粗框在左邊。 */
        .msg .bubble {
            display: inline-block;
            max-width: 70%;
            padding: 0.6em 1em;
            border: 1px solid #ffffff;
            white-space: pre-wrap;
        }
        .msg.user .bubble { border-right-width: 4px; }
        .msg.agent .bubble { border-left-width: 4px; }

        /* ------------------------------------------------------------
           等待中跑馬燈：「▪▪▪」三方塊依序亮暗循環
           ------------------------------------------------------------ */
        #waiting-indicator { margin-bottom: 1rem; }
        .marquee-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ffffff;
            margin-right: 6px;
            animation: marqueePulse 1.2s ease-in-out infinite;
        }
        .marquee-dot:nth-child(1) { animation-delay: 0s; }
        .marquee-dot:nth-child(2) { animation-delay: 0.2s; }
        .marquee-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes marqueePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        .waiting-label { margin-left: 0.4em; }

        /* ------------------------------------------------------------
           錯誤畫面
           ------------------------------------------------------------ */
        #error-screen {
            border: 2px solid #ffffff;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        #error-screen::before {
            content: "⚠ ";
        }

        /* ------------------------------------------------------------
           橫式時間軸元件（第六節規格）：
           - 節點橫向排列，節點間用白色橫線串接
           - 決策點項目加粗 + 閃爍框線凸顯
           - related_resource / 課程 有連結時可點擊開新分頁
           - overflow-x: auto 作保險（設計目標 4~5 節點在筆電螢幕內完整顯示）
           ------------------------------------------------------------ */
        .roadmap-container {
            margin-top: 0.6rem;
            max-width: 100%;
        }

        .roadmap-timeline {
            display: flex;
            align-items: flex-start;
            overflow-x: auto;
            padding: 1rem 0.2rem;
            opacity: 0;
            animation: roadmapFadeIn 0.4s ease forwards;
        }

        @keyframes roadmapFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .roadmap-node {
            flex: 0 0 230px;
            position: relative;
            padding: 0 0.9rem;
        }

        .roadmap-node:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 14px;
            right: -14px;
            width: 28px;
            height: 1px;
            background: #ffffff;
        }

        .roadmap-node-month {
            display: inline-block;
            border: 1px solid #ffffff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            line-height: 26px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }

        .roadmap-node-label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .roadmap-action {
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 0.4rem;
            padding-left: 0.6rem;
            border-left: 2px solid #ffffff;
        }

        .roadmap-action.decision {
            font-weight: bold;
            animation: decisionBlink 1s step-start infinite;
        }

        @keyframes decisionBlink {
            50% { border-left-color: transparent; }
        }

        .roadmap-action a {
            color: #ffffff;
            text-decoration: underline;
        }

        .roadmap-priority-tag {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-left: 0.3em;
        }

        .roadmap-courses {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .roadmap-courses a {
            color: #ffffff;
        }

        .roadmap-decision-points {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            border-top: 1px dashed #ffffff;
            padding-top: 0.5rem;
        }

        /* ------------------------------------------------------------
           快速評估問卷（互動式小視窗）
           以選擇題為主，每題可選「其他」自行輸入。填完後由 JS 組成
           一段完整敘述送給 Agent，避免多輪一問一答才走到試算與時間軸。
           ------------------------------------------------------------ */
        #wizard-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        #wizard-overlay.active { display: flex; }

        #wizard-box {
            position: relative;
            width: 620px;
            border: 2px solid #ffffff;
            background: #000000;
            padding: 1.6rem 1.8rem;
        }
        /* 雙層像素邊框，與按鈕風格一致 */
        #wizard-box::after {
            content: "";
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid #ffffff;
            pointer-events: none;
        }

        #wizard-progress {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 0.6rem;
        }

        #wizard-title {
            font-size: 1.3rem;
            margin: 0 0 0.4rem;
        }

        #wizard-hint {
            font-size: 0.85rem;
            opacity: 0.75;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        #wizard-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        /* 選項按鈕：左對齊、滿寬，與復古按鈕同語彙但更輕量 */
        .wizard-option {
            width: 100%;
            text-align: left;
            padding: 0.55em 1em;
            font-size: 0.95rem;
        }

        #wizard-other-row {
            display: none;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        #wizard-other-row.active { display: flex; }

        #wizard-other-input {
            flex: 1;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            padding: 0.55em 1em;
        }
        #wizard-other-input::placeholder { color: #888888; }

        #wizard-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: space-between;
        }
        #wizard-actions button { font-size: 0.9rem; }

        /* ------------------------------------------------------------
           輸入區
           ------------------------------------------------------------ */
        #input-bar { display: flex; gap: 0.6rem; }
        #message-input {
            flex: 1;
            background: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: inherit;
            font-size: 1rem;
            padding: 0.6em 1em;
        }
        #message-input::placeholder { color: #888888; }

        /* 鍵盤操作可見焦點（滑鼠點擊不會出現，只在 Tab 聚焦時顯示） */
        button:focus-visible,
        #message-input:focus-visible {
            outline: 2px dashed #ffffff;
            outline-offset: 3px;
        }

        /* ------------------------------------------------------------
           語音輸入：麥克風按鈕 + 聆聽中動畫
           - 圖示用 inline SVG 疊矩形畫成像素風麥克風，fill 用 currentColor，
             所以按鈕 hover 反白時圖示會自動跟著變黑，不需要額外規則。
           - 聆聽中：按鈕反白 + 外圈白光脈衝 + 內框閃爍，另外在輸入列上方
             顯示 5 根跳動的白色長條（波形）與「聆聽中」狀態文字。
           ------------------------------------------------------------ */
        #mic-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.6em 0.95em;
        }

        .mic-icon { display: block; }

        #mic-btn.listening {
            background: #ffffff;
            color: #000000;
            animation: micPulse 1.1s ease-out infinite;
        }
        #mic-btn.listening::after {
            border-color: #000000;
            animation: micRingBlink 0.9s step-start infinite;
        }

        @keyframes micPulse {
            from { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.75); }
            to   { box-shadow: 0 0 0 14px rgba(255, 255, 255, 0); }
        }

        @keyframes micRingBlink {
            50% { border-color: transparent; }
        }

        /* 不支援語音辨識時，按鈕降級為「僅示範動畫」，用虛線框暗示 */
        #mic-btn.demo-only { border-style: dashed; }

        #voice-status {
            display: none;
            align-items: flex-end;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
            min-height: 24px;
        }
        #voice-status.visible { display: flex; }

        .voice-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 24px;
        }

        .voice-bar {
            width: 6px;
            height: 6px;
            background: #ffffff;
            animation: voiceBar 0.9s ease-in-out infinite;
        }
        .voice-bar:nth-child(1) { animation-delay: 0s; }
        .voice-bar:nth-child(2) { animation-delay: 0.12s; }
        .voice-bar:nth-child(3) { animation-delay: 0.24s; }
        .voice-bar:nth-child(4) { animation-delay: 0.36s; }
        .voice-bar:nth-child(5) { animation-delay: 0.48s; }

        @keyframes voiceBar {
            0%, 100% { height: 6px; }
            50% { height: 24px; }
        }

        /* 停止聆聽後只留文字提示（權限被拒、不支援等），波形隱藏 */
        #voice-status.text-only .voice-bars { display: none; }

        .voice-label {
            font-size: 0.95rem;
            line-height: 24px;
        }

        /* 尊重系統「減少動態效果」設定：關掉所有裝飾性動畫 */
        @media (prefers-reduced-motion: reduce) {
            #mic-btn.listening,
            #mic-btn.listening::after,
            .voice-bar,
            .marquee-dot,
            .roadmap-action.decision {
                animation: none;
            }
            .voice-bar { height: 16px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         狀態機畫面：一次只顯示一個 .screen.active
         home-screen -> chat-screen
         chat-screen 內再由 JS 切換 waiting / error 狀態
         ============================================================ -->

    <div id="home-screen" class="screen">
        <h1 class="boot-item">職涯導航家</h1>
        <p class="boot-item">一站式政府補助 &amp; 轉職行動計畫 AI 顧問</p>
        <div class="boot-item" style="display: flex; gap: 0.8rem; margin-top: 0.4rem;">
            <button id="start-chat-btn" type="button">開始評估</button>
            <button id="demo-preset-btn" type="button">一鍵示範情境</button>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <div id="messages"></div>

        <div id="waiting-indicator" style="display: none;">
            <span class="marquee-dot"></span><span class="marquee-dot"></span><span class="marquee-dot"></span>
            <span class="waiting-label">等待中</span>
        </div>

        <div id="error-screen" style="display: none;">
            <span id="error-message"></span>
            <div style="margin-top: 0.8rem; display: flex; gap: 0.6rem;">
                <button id="retry-btn" type="button">重新發送</button>
                <button id="reset-btn" type="button">重新開始</button>
            </div>
        </div>

        <div id="input-bar">
            <input id="message-input" type="text" placeholder="輸入訊息..." autocomplete="off">
            <button id="send-btn" type="button">送出</button>
            <button id="wizard-open-btn" type="button">快速評估</button>
            <button id="reset-btn-2" type="button">重新開始</button>
        </div>
    </div>

    <!-- ============================================================
         快速評估問卷小視窗：選擇題為主，每題可選「其他」自填。
         填完後由 JS 組成完整敘述，分兩段自動送出（見 runWizardFlow）。
         ============================================================ -->
    <div id="wizard-overlay">
        <div id="wizard-box">
            <div id="wizard-progress"></div>
            <h2 id="wizard-title"></h2>
            <div id="wizard-hint"></div>
            <div id="wizard-options"></div>
            <div id="wizard-other-row">
                <input id="wizard-other-input" type="text" autocomplete="off">
                <button id="wizard-other-confirm" type="button">確定</button>
            </div>
            <div id="wizard-actions">
                <button id="wizard-back" type="button">上一題</button>
                <button id="wizard-cancel" type="button">改用自由對話</button>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        // ============================================================
        // 設定
        // ============================================================
        // 同源相對路徑：前端與 API 都由同一個 CloudFront distribution 提供，
        // /chat 這條 behavior 會被 CloudFront 以 OAC（SigV4）簽名後轉發到
        // Lambda Function URL。因此前端不需要知道 Function URL、不需簽名、
        // 也沒有跨網域 CORS 問題。（本機用 file:// 開啟時此路徑無效，需透過
        // CloudFront 網址存取；見 docs/reports/TASK_7_REPORT.md。）
        const API_ENDPOINT = "/chat";
        const WAIT_TIMEOUT_MS = 60000; // 第五節規格：等待超過 60 秒視為逾時
        const BOOT_FLAG_KEY = "cn_booted"; // sessionStorage：開場動畫只播一次
        const TYPE_INTERVAL_MS = 25; // 第四節規格：逐字打字機效果，每字 20~30ms

        // ============================================================
        // 時間軸連結對照表（第六節：不讓 Lambda 動態查詢，直接打包精簡版
        // resources.json / courses.json 進前端，用 id 查表取得連結）
        // 來源：app/careernav/data/resources.json、courses.json
        // ============================================================
        const RESOURCE_LINKS = {
            unemployment_benefit: {
                name: "失業給付",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050021",
            },
            training_living_allowance: {
                name: "職業訓練生活津貼",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050021",
            },
            early_reemployment_bonus: {
                name: "提早就業獎助津貼",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050021",
            },
            relocation_transport_subsidy: {
                name: "異地就業交通補助金",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050025",
            },
            relocation_moving_subsidy: {
                name: "搬遷補助金",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050025",
            },
            relocation_rent_subsidy: {
                name: "租屋補助金",
                source_url: "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0050025",
            },
        };

        const COURSE_LINKS = {
            preemployment_training_free: {
                name: "失業者職前訓練（政府補助）",
                source_url: "https://www.taiwanjobs.gov.tw/",
            },
            industry_talent_investment_program: {
                name: "產業人才投資方案（3 年 7 萬課程補助）",
                source_url: "https://tims.etraining.gov.tw/",
            },
            industry_elite_pioneer_youth: {
                name: "產業新尖兵試辦計畫",
                source_url: "https://elite.taiwanjobs.gov.tw/",
            },
        };

        // ============================================================
        // 狀態機
        // ============================================================
        // States: "home" | "chat" | "waiting" | "error"
        // chat / waiting / error 共用 #chat-screen 容器，用內部子元素
        // 的 display 切換，不算獨立 screen（跟第五節狀態機圖對應）。
        let currentState = "home";
        let lastUserMessage = ""; // 供「重新發送」使用
        let sessionId = null;
        let waitTimeoutHandle = null;

        function setState(state) {
            currentState = state;
            document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));

            if (state === "home") {
                document.getElementById("home-screen").classList.add("active");
            } else if (state === "chat" || state === "waiting" || state === "error") {
                document.getElementById("chat-screen").classList.add("active");
                document.getElementById("waiting-indicator").style.display = state === "waiting" ? "block" : "none";
                document.getElementById("error-screen").style.display = state === "error" ? "block" : "none";
                document.getElementById("input-bar").style.display = state === "chat" ? "flex" : "none";
            }
        }

        // 進入首頁：只有「網頁第一次載入」才播開場逐行淡入動畫（sessionStorage
        // 記 flag）；resetConversation() 呼叫的「重新開始」一律不重播。
        function enterHomeScreen() {
            setState("home");
            const homeScreen = document.getElementById("home-screen");
            if (!sessionStorage.getItem(BOOT_FLAG_KEY)) {
                homeScreen.classList.add("play-intro");
                sessionStorage.setItem(BOOT_FLAG_KEY, "1");
            } else {
                homeScreen.classList.remove("play-intro");
            }
        }

        // ============================================================
        // Session 管理
        // ============================================================
        function getOrCreateSessionId() {
            if (sessionId) return sessionId;
            // AgentCore runtimeSessionId 最短 33 字元（Lambda 端也有補齊保護，
            // 這裡直接產生足夠長度的 id）。
            sessionId = "web-" + crypto.randomUUID() + "-" + crypto.randomUUID();
            return sessionId;
        }

        function resetConversation() {
            sessionId = null;
            lastUserMessage = "";
            document.getElementById("messages").innerHTML = "";
            document.getElementById("message-input").value = "";
            // 明確移除 play-intro：避免 display:none -> block 切換時
            // CSS 動畫重播（.play-intro 只應在網頁「第一次」載入時存在）。
            document.getElementById("home-screen").classList.remove("play-intro");
            setState("home");
        }

        // ============================================================
        // 對話訊息渲染
        // ============================================================
        // 使用者訊息立即顯示；Agent 回覆用逐字打字機效果（第四節規格：
        // 每字 20~30ms，本專案取 TYPE_INTERVAL_MS = 25ms）。
        function appendMessage(role, text) {
            const messages = document.getElementById("messages");
            const wrapper = document.createElement("div");
            wrapper.className = "msg " + role;
            const bubble = document.createElement("div");
            bubble.className = "bubble";
            if (role === "agent") {
                // 逐字效果另外由呼叫端透過 typeText() 觸發，這裡先留空。
            } else {
                bubble.textContent = text;
            }
            wrapper.appendChild(bubble);
            messages.appendChild(wrapper);
            messages.scrollTop = messages.scrollHeight;
            return bubble;
        }

        // 逐字把 text 插入 bubble.textContent，完成後 resolve。
        // 只用在 Agent 回覆；使用者訊息維持立即顯示（見 appendMessage）。
        function typeText(bubble, text, intervalMs) {
            return new Promise((resolve) => {
                const chars = Array.from(text || "");
                if (chars.length === 0) {
                    resolve();
                    return;
                }
                let i = 0;
                const messages = document.getElementById("messages");
                const timer = setInterval(() => {
                    bubble.textContent += chars[i];
                    i++;
                    messages.scrollTop = messages.scrollHeight;
                    if (i >= chars.length) {
                        clearInterval(timer);
                        resolve();
                    }
                }, intervalMs);
            });
        }

            const link = action.related_resource ? RESOURCE_LINKS[action.related_resource] : null;

                a.href = link.source_url;

            if (action.priority) {

        function renderCourseLine(course) {

        function buildRoadmapElement(roadmap) {
            const container = document.createElement("div");
            container.className = "roadmap-container";

            const track = document.createElement("div");
            track.className = "roadmap-timeline";

            const curatedCourses = (roadmap.courses && roadmap.courses.curated) || [];

            (roadmap.timeline || []).forEach((node) => {
                const nodeEl = document.createElement("div");
                nodeEl.className = "roadmap-node";

                const monthEl = document.createElement("span");
                monthEl.className = "roadmap-node-month";
                monthEl.textContent = node.month;

                labelEl.className = "roadmap-node-label";
                labelEl.textContent = node.label || ("第 " + node.month + " 月");
                nodeEl.appendChild(labelEl);

                (node.actions || []).forEach((action) => {
                    nodeEl.appendChild(renderActionLine(action));

                // action 的節點）。
                const hasTrainingAction = (node.actions || []).some(
                    (a) => a.related_resource === "training_living_allowance"

                if (hasTrainingAction && curatedCourses.length) {

        // demo 用示範情境（情境 A：58 歲工廠作業員因自動化被資遣）

        const DEMO_PRESET = {
            age: 58,
            leave_reason: "非自願",
            insurance_months: 240,
            avg_insured_salary: 36300,
            dependents_count: 1,
            has_disability_cert: false,

        let wizardIndex = 0;
        let wizardAnswers = {};

        function openWizard() {
            wizardIndex = 0;
            wizardAnswers = {};
            document.getElementById("wizard-overlay").classList.add("active");
            renderWizardQuestion();

        function closeWizard() {
            document.getElementById("wizard-overlay").classList.remove("active");

        function renderWizardQuestion() {
            const q = WIZARD_QUESTIONS[wizardIndex];
            document.getElementById("wizard-progress").textContent =
                "快速評估　" + (wizardIndex + 1) + " / " + WIZARD_QUESTIONS.length;

            document.getElementById("wizard-hint").textContent = q.hint || "";

                optionsEl.appendChild(btn);
            });

            // 「其他」選項：點了才展開輸入框，維持選擇題為主的操作節奏

        function submitWizardOther() {
            const q = WIZARD_QUESTIONS[wizardIndex];
            const raw = document.getElementById("wizard-other-input").value.trim();
            if (!raw) return;
            let value = raw;
            if (q.other && q.other.numeric) {
                const n = parseInt(raw.replace(/[^\d]/g, ""), 10);
                if (isNaN(n)) return;
                value = q.other.transform ? q.other.transform(n) : n;
            }
            answerWizard(q.id, value);
        }

        function answerWizard(id, value) {
            wizardAnswers[id] = value;
            if (wizardIndex < WIZARD_QUESTIONS.length - 1) {
                wizardIndex++;
                renderWizardQuestion();
            } else {
                closeWizard();
                runWizardFlow(wizardAnswers);
            }
        }

        // 把問卷答案組成一段自然語言敘述，交給 Agent 的 analyze_profile 解析。
        function composeProfileText(answers) {
            return WIZARD_QUESTIONS
                .filter((q) => q.id in answers)
                .map((q) => q.toText(answers[q.id]))
                .join("；") + "。";
        }

        // 兩段式流程：先資格與試算，再時間軸與文件清單。
        async function runWizardFlow(answers) {
            const profileText = composeProfileText(answers);

            const phase1 =
                profileText +
                "\n\n請依序執行 analyze_profile、match_resources、calculate_benefit，" +
                "告訴我符合哪些補助、每項可領多少、共可領多少，並附上法規條號。" +
                "請用精簡條列呈現，不要重複問我已提供的資訊。";

            const phase2 =
                "請接著執行 generate_roadmap 與 get_checklist，" +
                "產出我的 1~6 個月行動計畫時間軸與應備文件清單。回覆請精簡。";

            const ok = await sendMessage(phase1);
            if (ok) {
                await sendMessage(phase2);
            }
        }

        // ============================================================
        // API 呼叫
        // ============================================================
        // 用 GET + query string 呼叫，不用 POST。
        // 原因：公開入口是 CloudFront + Origin Access Control（OAC）簽名
        // 呼叫 Lambda Function URL（AuthType=AWS_IAM），因為比賽沙盒帳號的
        // guardrail 封鎖匿名 Function URL。OAC 對 POST 需要呼叫端自行計算
        // body 的 SHA256 並帶 x-amz-content-sha256 header；改用 GET 就沒有
        // body，CloudFront 能自行完成整個簽名，瀏覽器端零簽名邏輯。
        // 回傳 true 表示這輪成功（供 runWizardFlow 決定是否續送第二段）。
        // requestInFlight 是併發鎖：同一個 session_id 若同時有兩個請求打進
        // AgentCore，會共用同一個 Agent 實例與對話歷史而導致回應為空
        // （已實測）。因此任一請求進行中就拒絕新的送出。
        let requestInFlight = false;

        async function sendMessage(text) {
            if (requestInFlight) return false;
            requestInFlight = true;
            lastUserMessage = text;
            appendMessage("user", text);
            setState("waiting");

            waitTimeoutHandle = setTimeout(() => {
                showError("等待超過 60 秒，請重新發送");
            }, WAIT_TIMEOUT_MS);

            try {
                const query = new URLSearchParams({
                    q: text,
                    session_id: getOrCreateSessionId(),
                });
                const resp = await fetch(API_ENDPOINT + "?" + query.toString(), {
                    method: "GET",
                });

                clearTimeout(waitTimeoutHandle);

                if (!resp.ok) {
                    let detail = "";
                    try {
                        const errBody = await resp.json();
                        detail = errBody.error || "";
                    } catch (e) {
                        // 回應不是 JSON，忽略細節，仍以 HTTP 狀態碼提示錯誤
                    }
                    showError("發生錯誤（" + resp.status + "）" + (detail ? "：" + detail : ""));
                    return false;
                }

                const data = await resp.json();
                if (data.session_id) sessionId = data.session_id;

                setState("chat");
                const bubble = appendMessage("agent", "");
                await typeText(bubble, data.reply || "（沒有收到回覆內容）", TYPE_INTERVAL_MS);
                // 規格：若這輪有 roadmap 資料，文字顯示完後才淡入時間軸卡片。
                if (data.roadmap) {
                    appendRoadmap(data.roadmap);
                }
                return true;
            } catch (err) {
                clearTimeout(waitTimeoutHandle);
                showError("無法連上伺服器，請檢查網路連線後重新發送");
                return false;
            } finally {
                requestInFlight = false;
            }
        }

        function showError(message) {
            document.getElementById("error-message").textContent = message;
            setState("error");
        }

        function retrySend() {
            if (!lastUserMessage) {
                setState("chat");
                return;
            }
            sendMessage(lastUserMessage);
        }

        // ============================================================
        // 語音輸入（Web Speech API）
        // ============================================================
        // 兩層設計，確保 demo 當天不論在哪台機器都有東西可看：
        //   1. 支援 SpeechRecognition 的瀏覽器（Chrome / Edge / 新版 Safari）
        //      → 真的辨識，interim 結果即時回填輸入框。
        //   2. 不支援、或使用者拒絕麥克風權限、或用 file:// 開啟（非安全來源）
        //      → 降級為「示範動畫」：一樣播聆聽中波形約 2.6 秒，
        //        結束後在狀態列說明原因，請使用者改用文字輸入。
        // 注意：Chrome 的 webkitSpeechRecognition 需要 HTTPS（或 localhost）
        // 才會給麥克風權限，走 CloudFront 網址即符合；本機 file:// 會落到
        // 第 2 層降級路徑。
        const VOICE_LANG = "zh-TW";
        const VOICE_DEMO_MS = 2600; // 降級模式的動畫時長
        // 設為 true 可在辨識完成後自動送出（真正免手打的 demo）；
        // 預設 false，讓使用者先確認辨識文字再按送出，避免誤送。
        const VOICE_AUTO_SEND = false;

        const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;
        let voiceDemoHandle = null;
        let voiceBaseText = ""; // 開始聆聽前輸入框已有的文字，辨識結果接在後面

        function setVoiceStatus(text, opts) {
            const showBars = !!(opts && opts.bars);
            const statusEl = document.getElementById("voice-status");
            document.getElementById("voice-label").textContent = text || "";
            statusEl.classList.toggle("visible", !!text);
            statusEl.classList.toggle("text-only", !!text && !showBars);
        }

        // 聆聽中的視覺狀態：麥克風按鈕反白脈衝 + 波形 + placeholder 提示
        function setListeningUI(on, label) {
            const micBtn = document.getElementById("mic-btn");
            const input = document.getElementById("message-input");
            micBtn.classList.toggle("listening", on);
            micBtn.setAttribute("aria-pressed", on ? "true" : "false");
            if (on) {
                setVoiceStatus(label || "聆聽中…（再點一次麥克風結束）", { bars: true });
                input.placeholder = "聆聽中…";
            } else {
                input.placeholder = "輸入訊息...";
            }
        }

        // 降級示範模式：只播動畫，不做辨識。
        function startVoiceDemo(reason) {
            if (isListening) return;
            isListening = true;
            setListeningUI(true, "聆聽中…（示範動畫）");
            voiceDemoHandle = setTimeout(() => {
                voiceDemoHandle = null;
                isListening = false;
                setListeningUI(false);
                setVoiceStatus(reason, { bars: false });
            }, VOICE_DEMO_MS);
        }

        function createRecognition() {
            const rec = new SpeechRecognitionCtor();
            rec.lang = VOICE_LANG;
            rec.interimResults = true; // 邊說邊回填，讓 demo 看得到即時反應
            rec.continuous = false;    // 說完一段自動結束，避免忘記關麥克風
            rec.maxAlternatives = 1;

            rec.addEventListener("start", () => {
                isListening = true;
                setListeningUI(true);
            });

            rec.addEventListener("result", (event) => {
                let interim = "";
                let final = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const chunk = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += chunk;
                    } else {
                        interim += chunk;
                    }
                }
                const input = document.getElementById("message-input");
                if (final) {
                    voiceBaseText = (voiceBaseText + final).trim();
                    input.value = voiceBaseText;
                } else {
                    input.value = (voiceBaseText + interim).trim();
                }
            });

            rec.addEventListener("error", (event) => {
                // 權限類錯誤直接降級並說明；其他錯誤給可行動的提示。
                const messages = {
                    "not-allowed": "麥克風權限被拒，請在瀏覽器網址列的權限設定允許麥克風，或改用文字輸入",
                    "service-not-allowed": "此環境不允許語音服務（需 HTTPS 網址），請改用文字輸入",
                    "no-speech": "沒有偵測到語音，請再試一次",
                    "audio-capture": "找不到可用的麥克風裝置",
                    "network": "語音辨識服務連線失敗，請改用文字輸入",
                    "aborted": "",
                };
                const msg = event.error in messages
                    ? messages[event.error]
                    : "語音辨識發生問題（" + event.error + "），請改用文字輸入";
                if (msg) setVoiceStatus(msg, { bars: false });
            });

            rec.addEventListener("end", () => {
                isListening = false;
                setListeningUI(false);
                const input = document.getElementById("message-input");
                const text = input.value.trim();
                // 狀態列已有錯誤訊息時不要覆蓋（error 事件先於 end 觸發）
                const label = document.getElementById("voice-label").textContent;
                if (!label) {
                    setVoiceStatus(text ? "已完成辨識，可修改後送出" : "", { bars: false });
                }
                if (VOICE_AUTO_SEND && text) {
                    input.value = "";
                    setVoiceStatus("");
                    sendMessage(text);
                }
            });

            return rec;
        }

        function startListening() {
            if (isListening) return;
            if (!SpeechRecognitionCtor) {
                startVoiceDemo("此瀏覽器不支援語音辨識（建議 Chrome / Edge），請改用文字輸入");
                return;
            }
            if (!window.isSecureContext) {
                // http:// 或 file:// 開啟時瀏覽器不會給麥克風權限，直接走降級
                startVoiceDemo("語音輸入需要 HTTPS 網址，請改用文字輸入");
                return;
            }
            setVoiceStatus("");
            voiceBaseText = document.getElementById("message-input").value.trim();
            if (voiceBaseText) voiceBaseText += " ";
            try {
                recognition = recognition || createRecognition();
                recognition.start();
            } catch (err) {
                // 例如上一次辨識尚未完全結束就再次 start()
                isListening = false;
                setListeningUI(false);
                setVoiceStatus("語音輸入啟動失敗，請稍候再試或改用文字輸入", { bars: false });
            }
        }

        function stopListening() {
            if (voiceDemoHandle) {
                clearTimeout(voiceDemoHandle);
                voiceDemoHandle = null;
            }
            if (recognition && isListening) {
                try {
                    recognition.stop();
                } catch (err) {
                    // 已經停止就忽略
                }
            }
            isListening = false;
            setListeningUI(false);
        }

        function toggleListening() {
            if (isListening) {
                stopListening();
                setVoiceStatus("");
            } else {
                startListening();
            }
        }

        // ============================================================
        // 事件綁定
        // ============================================================
        // 「開始對話」直接帶出快速評估問卷：live demo 要能少打字、快觸發。
        document.getElementById("start-chat-btn").addEventListener("click", () => {
            setState("chat");
            openWizard();
        });

        // 一鍵示範情境：台上最快路徑，跳過逐題點選直接跑兩段式流程。
        document.getElementById("demo-preset-btn").addEventListener("click", () => {
            setState("chat");
            closeWizard();
            runWizardFlow(DEMO_PRESET);
        });

        document.getElementById("wizard-open-btn").addEventListener("click", openWizard);
        document.getElementById("wizard-cancel").addEventListener("click", closeWizard);
        document.getElementById("wizard-other-confirm").addEventListener("click", submitWizardOther);
        document.getElementById("wizard-other-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") submitWizardOther();
        });
        document.getElementById("wizard-back").addEventListener("click", () => {
            if (wizardIndex > 0) {
                wizardIndex--;
                renderWizardQuestion();
            }
        });

        document.getElementById("send-btn").addEventListener("click", () => {
            const input = document.getElementById("message-input");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            sendMessage(text);
        });

        // 麥克風：點一下開始聆聽，再點一下結束（鍵盤 Enter/Space 亦可，因為是 button）
        document.getElementById("mic-btn").addEventListener("click", toggleListening);

        document.getElementById("message-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                document.getElementById("send-btn").click();
            }
        });

        document.getElementById("retry-btn").addEventListener("click", retrySend);
        document.getElementById("reset-btn").addEventListener("click", resetConversation);
        document.getElementById("reset-btn-2").addEventListener("click", resetConversation);

        // ============================================================
        // 開場
        // ============================================================
        enterHomeScreen();
    </script>
</body>
</html>
