[project]
name = "careernav-agent"
version = "0.1.0"
description = "職涯導航家 — Strands Agent for career navigation"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-bedrock>=0.1.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "python-dotenv>=1.0.0",
]
mcp = [
    "strands-agents-mcp>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
